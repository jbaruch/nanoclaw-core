version: 2
updates:
  # Keep the dev toolchain (pyright, ruff, pytest) on the latest release
  # without giving up reproducibility: deps stay hard-pinned in
  # requirements-dev.txt, and Dependabot opens a PR for each new version so
  # the bump is reviewed and CI proves it green before it lands — rather
  # than a floating spec that can break CI on an unrelated PR.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    labels:
      - dependencies
  # Keep the Actions used by the test workflow current on the same terms.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(ci)
    labels:
      - dependencies
    # Actions that appear ONLY inside the gh-aw-compiled
    # `.github/workflows/*.lock.yml` files are owned by the `gh aw compile`
    # step, not hand-authored here. Their `.gitattributes` `merge=ours`
    # marking makes a Dependabot bump a no-op release, and the next
    # reviewer-template upgrade recompile reverts it anyway (see closed
    # PRs #57-#59). They refresh via the `tessl__install-reviewer` upgrade
    # flow instead. `actions/checkout` and `actions/setup-python` are NOT
    # ignored — those are hand-authored in test.yml and stay
    # Dependabot-managed (see #60, #61). publish.yml is now a thin caller of
    # the reusable publish workflow; its pinned reusable-workflow ref is the
    # Dependabot-managed dependency there.
    # Exact dependency names (not a wildcard) — Dependabot's github-actions
    # ecosystem names each sub-action by its full path, and wildcard
    # matching on nested paths is unreliable.
    ignore:
      - dependency-name: actions/cache/save
      - dependency-name: actions/cache/restore
      - dependency-name: github/gh-aw-actions/setup
