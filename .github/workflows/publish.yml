name: Review & Publish Plugin

# Thin caller for the canonical fleet publish pipeline
# (jbaruch/coding-policy#206). The test.yml gate stays a local `needs` job so
# publish still waits on the same suite the PRs run.

# Least privilege per job: nothing at workflow level.
permissions: {}

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  gate:
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml

  publish:
    needs: gate
    permissions:
      id-token: write
      contents: write
      pull-requests: write
    uses: jbaruch/coding-policy/.github/workflows/publish-plugin.yml@af116ebf18a7c46a672bf176064908736bc8ac28
    secrets:
      TESSL_TOKEN: ${{ secrets.TESSL_TOKEN }}
    with:
      stamp-changelog: true
      skill-review-credit-outage: skip