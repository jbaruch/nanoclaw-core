name: Test

permissions:
  contents: read

on:
  pull_request:
  # Callable as the publish workflow's gate job — main-push coverage
  # comes from that call, so no separate `push: main` trigger (it
  # would run the suite twice per merge).
  workflow_call:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt

      # Lint runs before tests per `jbaruch/coding-policy: code-formatting`
      # — catches style/import issues fast and cheaply before pytest
      # boots fixtures.
      - name: Lint (ruff)
        run: |
          python -m ruff check tests/
          python -m ruff format --check tests/

      # Diagnostics gate per `jbaruch/coding-policy: language-diagnostics`
      # — runs pyright at zero findings before tests, resolving the
      # skill-bundle sys.path layout via pyrightconfig.json. `--warnings`
      # makes warnings (not just errors) fail the step's exit code.
      - name: Type check (pyright)
        run: python -m pyright --warnings skills/ tests/

      - name: Pytest
        run: python -m pytest
